services:
  postgres:
    image: postgres:16
    container_name: legacylens-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: legacylens
      POSTGRES_PASSWORD: legacylens
      POSTGRES_DB: legacylens
    volumes:
      - pgdata:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    container_name: legacylens-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/legacylens
    volumes:
      - neo4jdata:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: legacylens-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: legacylens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
  neo4jdata:
  qdrantdata:
